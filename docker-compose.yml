# Local development database only. The port is bound to 127.0.0.1, so it is
# not reachable from other machines. Host port 5433 avoids clashing with a
# PostgreSQL installed directly on the machine (which uses 5432). Production uses its own managed database
# and its own credentials.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ivl
      POSTGRES_PASSWORD: ivl_local_dev
      POSTGRES_DB: invoyce_lite
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ivl -d invoyce_lite"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Only for trying the MySQL / MariaDB build: `docker compose --profile mysql up -d`.
  mariadb:
    image: mariadb:11.4
    profiles: ["mysql"]
    restart: unless-stopped
    environment:
      MARIADB_USER: ivl
      MARIADB_PASSWORD: ivl_local_dev
      MARIADB_DATABASE: invoyce_lite
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  mariadb_data:
